site_name: stupidswiki
site_description: 记录一群傻*。一群人的梗档案、事件簿和黑话表。
site_url: https://xiezao1225.github.io/stupidswiki.github.io/

docs_dir: docs
site_dir: site

hooks:
  - hooks/wiki.py

theme:
  name: material
  language: zh
  icon:
    logo: material/book-open-variant
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切到浅色

repo_url: https://github.com/Xiezao1225/stupidswiki.github.io
repo_name: stupidswiki
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/wiki.css

extra_javascript:
  - assets/liquid-glass.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 入门:
      - 怎么用这个 wiki: guide-start.md
  - 编辑指南:
      - 新增一页: guide-add-page.md
      - Markdown 速查: guide-markdown.md
      - 条目模板: template-entry.md
  - 模板:
      - 页首模板一览: templates.md
      - 提示条的写法: guide-notice.md
  - 人物志:
      - 示例条目：老王: entry-sample.md
      - 萝莉控老班长: fucked-lolicon.md
  - 其他:
      - 沙盒: sandbox.md
