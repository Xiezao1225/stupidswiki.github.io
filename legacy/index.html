<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stupidswiki</title>
<meta name="description" content="记录一群傻*。一个由 Markdown 驱动的轻量 wiki。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a63d22'/%3E%3Cpath d='M8 10.5h4.2l1.9 7.6 2.2-7.6h3.4l2.2 7.6 1.9-7.6H28l-3.6 11.5h-3.6l-2.4-7.7-2.4 7.7h-3.6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>

<header class="topbar">
  <div class="topbar__inner">
    <button class="icon-btn topbar__menu" id="menuBtn" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>

    <a class="brand" href="#/" id="brand">
      <span class="brand__mark" aria-hidden="true">W</span>
      <span class="brand__text">
        <span class="brand__name" id="brandName">stupidswiki</span>
        <span class="brand__tagline" id="brandTagline">记录一群傻*</span>
      </span>
    </a>

    <div class="topbar__spacer"></div>

    <button class="search-trigger" id="searchTrigger" type="button" aria-label="搜索页面">
      <svg class="search-trigger__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="search-trigger__label">搜索</span>
      <kbd class="search-trigger__kbd" id="searchKbd">Ctrl K</kbd>
    </button>

    <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色模式" title="切换深浅色">
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.2v2M10 15.8v2M2.2 10h2M15.8 10h2M4.5 4.5 5.9 5.9M14.1 14.1l1.4 1.4M15.5 4.5 14.1 5.9M5.9 14.1 4.5 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.4A6.6 6.6 0 0 1 7.6 4a6.7 6.7 0 1 0 8.4 8.4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="页面目录">
    <nav class="sidebar__nav" id="sidebarNav"></nav>
    <div class="sidebar__footer">
      <a class="sidebar__repo" id="repoLink" hidden target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.19c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
        <span>在 GitHub 上查看</span>
      </a>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main__inner" id="mainInner">
      <div class="page-meta" id="pageMeta" hidden></div>
      <article class="markdown" id="article"></article>
      <nav class="pager" id="pager" aria-label="翻页" hidden></nav>
      <footer class="site-footer">
        <span id="siteFooter">用 Markdown 写的静态 wiki</span>
        <span class="site-footer__dot">·</span>
        <a href="#/" id="homeLink">回到首页</a>
      </footer>
    </div>
  </main>

  <aside class="toc" id="toc" aria-label="本页目录">
    <div class="toc__title">本页目录</div>
    <ol class="toc__list" id="tocList"></ol>
  </aside>
</div>

<div class="search" id="search" hidden>
  <div class="search__scrim" data-close-search></div>
  <div class="search__panel" role="dialog" aria-modal="true" aria-label="搜索页面">
    <div class="search__field">
      <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input class="search__input" id="searchInput" type="search" placeholder="搜索标题或正文…" autocomplete="off" spellcheck="false" aria-controls="searchResults" aria-describedby="searchHint">
      <button class="search__close" type="button" data-close-search aria-label="关闭搜索">Esc</button>
    </div>
    <ul class="search__results" id="searchResults" role="listbox" aria-label="搜索结果"></ul>
    <div class="search__hint" id="searchHint">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>Enter</kbd> 打开</span>
      <span><kbd>Esc</kbd> 关闭</span>
    </div>
  </div>
</div>

<script src="assets/markdown.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
